<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover maximum-scale=1.0, user-scalable=no"
    />
    <title>Frappe CRM</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Frappe CRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />

    <!-- PWA Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="196x196"
      href="/assets/crm/manifest/apple-icon-180.png"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/crm/manifest/apple-icon-180.png"
    />

    <!-- Native Frappe CRM Frontend Bundle -->
    <script type="module" crossorigin src="/assets/crm/frontend/assets/index-DfRUA-MY.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/crm/frontend/assets/index-DlETA4ls.css">
    <link rel="manifest" href="/assets/crm/frontend/manifest.webmanifest">
    <script id="vite-plugin-pwa:register-sw" src="/assets/crm/frontend/registerSW.js"></script>

    <!-- Nexapp Custom Sidebar Theme for CRM SPA -->
    <link rel="stylesheet" href="/assets/nexapp/css/crm_custom_sidebar.css?v=20260821_v12_redesign">

    <!-- Nexapp CRM Lead & Deal Page Enhancement Theme -->
    <link rel="stylesheet" href="/assets/nexapp/css/crm_lead_enhancement.css?v=20260821_v12_redesign">

    <!-- Nexapp Custom CRM Extensions Script -->
    <script src="/assets/nexapp/js/crm_extensions.js?v=20260821_v12_redesign"></script>
  </head>
  <body class="sm:overscroll-y-none no-scrollbar">
    <div id="app" class="h-full"></div>

    <script id="frappe-boot-data" type="application/json">
      {{ boot | tojson }}
    </script>
    <script>
      (function() {
        try {
          var bootElem = document.getElementById("frappe-boot-data");
          if (bootElem && bootElem.textContent) {
            var bootData = JSON.parse(bootElem.textContent);
            if (bootData && typeof bootData === "object") {
              Object.keys(bootData).forEach(function(key) {
                window[key] = bootData[key];
              });
            }
          }
        } catch (err) {
          console.warn("[NEXAPP CRM] Boot data parse notice:", err);
        }
      })();
    </script>
  </body>
</html>
